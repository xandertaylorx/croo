name: Release

# Publish a build to GitHub Releases when a version tag is pushed:
#   git tag v0.7.0 && git push origin v0.7.0
# The app checks the latest release and shows "Croo x.y.z is out" at the bottom left of the sidebar.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run engine
      - run: npm run build
      # This build is unsigned. For a signed, notarized build, run the release from a Mac that has the
      # Developer ID certificate (see README, "Releases and updates"), or add CSC_LINK and CSC_KEY_PASSWORD
      # secrets here. Passing them while empty breaks electron-builder, so they are left out on purpose.
      # electron-builder's own GitHub publisher races itself and can create two releases, so build
      # first and create the release once with gh.
      - run: npx electron-builder --mac --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - run: gh release create "$GITHUB_REF_NAME" release/*.dmg release/*.zip release/*.blockmap --title "Croo ${GITHUB_REF_NAME#v}" --generate-notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
